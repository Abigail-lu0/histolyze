<div class="card">
  <div class="card-header bg-secondary text-white">
    Historial de Pacientes
  </div>
  <div class="card-body">
    <div class="row mb-3">
      <div class="col-md-6">
        <input type="text" id="searchDni" class="form-control" placeholder="Buscar por DNI">
      </div>
      <div class="col-md-6">
        <input type="text" id="searchMuestra" class="form-control" placeholder="Buscar por Nro de muestra">
      </div>
    </div>
    <div class="table-responsive">
      <table class="table table-striped table-hover" id="pacientesTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>DNI</th>
            <th>Nro muestra</th>
            <th>Centro de Tx</th>
            <th>Médico solicitante</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <!-- Filas dinámicas desde main.js -->
        </tbody>
      </table>
    </div>
  </div>
</div>
