<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 id="nombre-paciente-header">Perfil del Paciente</h3>
        <button class="btn btn-secondary" id="btn-volver-historial">&larr; Volver al Historial</button>
    </div>

    <div class="card mb-4">
        <div class="card-header d-flex justify-content-between">
            <h5>Datos Personales</h5>
            <button class="btn btn-sm btn-outline-primary" id="btn-editar-personales">Editar</button>
        </div>
        <div class="card-body" id="datos-personales-view"></div>
        <div class="card-body d-none" id="datos-personales-edit">
            <form id="form-edit-paciente"></form>
        </div>
    </div>

    <div class="accordion" id="historialAccordion">
        <div class="accordion-item">
            <h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTrasplantes">Historial de Trasplantes</button></h2>
            <div id="collapseTrasplantes" class="accordion-collapse collapse" data-bs-parent="#historialAccordion">
                <div class="card-body">
                    <div id="lista-trasplantes"></div>
                    <button class="btn btn-success btn-sm mt-3" data-bs-toggle="modal" data-bs-target="#modalAgregarTrasplante">Agregar Trasplante</button>
                </div>
            </div>
        </div>
        <div class="accordion-item">
            <h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTransfusiones">Historial de Transfusiones</button></h2>
            <div id="collapseTransfusiones" class="accordion-collapse collapse" data-bs-parent="#historialAccordion">
                 <div class="card-body">
                    <div id="lista-transfusiones"></div>
                    <button class="btn btn-success btn-sm mt-3" data-bs-toggle="modal" data-bs-target="#modalAgregarTransfusion">Agregar Transfusión</button>
                </div>
            </div>
        </div>
        <div class="accordion-item">
            <h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseDsa">Historial de Estudios DSA</button></h2>
            <div id="collapseDsa" class="accordion-collapse collapse" data-bs-parent="#historialAccordion">
                 <div class="card-body">
                    <div id="lista-dsa"></div>
                    <button class="btn btn-success btn-sm mt-3" data-bs-toggle="modal" data-bs-target="#modalAgregarDsa">Agregar Estudio DSA</button>
                </div>
            </div>
        </div>
        <div class="accordion-item">
            <h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseCrossmatch">Historial de Cross-match contra panel</button></h2>
            <div id="collapseCrossmatch" class="accordion-collapse collapse" data-bs-parent="#historialAccordion">
                 <div class="card-body">
                    <div id="lista-crossmatch"></div>
                    <button class="btn btn-success btn-sm mt-3" data-bs-toggle="modal" data-bs-target="#modalAgregarCrossmatch">Agregar Cross-match</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalAgregarTrasplante" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Agregar Nuevo Trasplante</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><form id="form-add-trasplante"><div class="mb-3"><label class="form-label">Fecha del Trasplante</label><input type="date" class="form-control" name="fecha" required></div></form></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button type="submit" form="form-add-trasplante" class="btn btn-primary">Guardar</button></div></div></div></div>
<div class="modal fade" id="modalAgregarTransfusion" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Agregar Nueva Transfusión</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><form id="form-add-transfusion"><div class="mb-3"><label class="form-label">Fecha</label><input type="date" class="form-control" name="fecha" required></div><div class="mb-3"><label class="form-label">PD</label><input type="text" class="form-control" name="pd" required></div></form></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button type="submit" form="form-add-transfusion" class="btn btn-primary">Guardar</button></div></div></div></div>
<div class="modal fade" id="modalAgregarDsa" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Agregar Estudio DSA</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><form id="form-add-dsa"><div class="mb-3"><label class="form-label">Fecha del Estudio</label><input type="date" class="form-control" name="fecha" required></div><div class="mb-3"><label class="form-label">Resultado</label><textarea class="form-control" name="resultado" rows="3" required></textarea></div></form></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button type="submit" form="form-add-dsa" class="btn btn-primary">Guardar</button></div></div></div></div>
<div class="modal fade" id="modalAgregarCrossmatch" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Agregar Cross-match contra panel</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><form id="form-add-crossmatch"><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Fecha</label><input type="date" class="form-control" name="fecha" required></div><div class="col-md-6 mb-3"><label class="form-label">Nº</label><input type="text" class="form-control" name="numero" required></div></div><div class="row"><div class="col-md-4 mb-3"><label class="form-label">Anti-HLA I (%)</label><input type="number" class="form-control" name="anti_hla_1" required></div><div class="col-md-4 mb-3"><label class="form-label">Anti-HLA II (%)</label><input type="number" class="form-control" name="anti_hla_2" required></div><div class="col-md-4 mb-3"><label class="form-label">Anti MICA (%)</label><input type="number" class="form-control" name="anti_mica" required></div></div><div class="mb-3"><label class="form-label">Anticuerpos Específicos no Confirmados</label><textarea class="form-control" name="no_confirmados" rows="3"></textarea></div></form></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button type="submit" form="form-add-crossmatch" class="btn btn-primary">Guardar</button></div></div></div></div>
