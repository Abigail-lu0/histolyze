<!-- Contenedor de alertas local para Crossmatch -->
<div id="formAlertsDSA" class="mb-3"></div>

<form id="formAnticuerpos" novalidate>
    <div class="row mb-3">
        <div class="col-md-3">
            <label for="fechaAnticuerpos" class="form-label">Fecha</label>
            <input type="date" class="form-control" id="fechaAnticuerpos" name="fechaAnticuerpos" required>
            <div class="invalid-feedback">Seleccione una fecha.</div>
        </div>

        <div class="col-md-3">
            <label for="numeroAnticuerpos" class="form-label">Nº</label>
            <input type="text" class="form-control" id="numeroAnticuerpos" name="numeroAnticuerpos" required pattern="^[0-9]+$">
            <div class="invalid-feedback">Ingrese un número válido.</div>
        </div>

        <div class="col-md-2">
            <label for="antiHlaI" class="form-label">Anti-HLA I (%)</label>
            <input type="number" class="form-control" id="antiHlaI" name="antiHlaI" min="0" max="100" placeholder="%" required>
            <div class="invalid-feedback">Ingrese un valor entre 0 y 100.</div>
        </div>

        <div class="col-md-2">
            <label for="antiHlaII" class="form-label">Anti-HLA II (%)</label>
            <input type="number" class="form-control" id="antiHlaII" name="antiHlaII" min="0" max="100" placeholder="%" required>
            <div class="invalid-feedback">Ingrese un valor entre 0 y 100.</div>
        </div>

        <div class="col-md-2">
            <label for="antiMica" class="form-label">Anti MICA (%)</label>
            <input type="number" class="form-control" id="antiMica" name="antiMica" min="0" max="100" placeholder="%" required>
            <div class="invalid-feedback">Ingrese un valor entre 0 y 100.</div>
        </div>
    </div>

    <div class="mb-3">
        <label for="anticuerposNoConfirmados" class="form-label">Anticuerpos Específicos no Confirmados</label>
        <textarea class="form-control" id="anticuerposNoConfirmados" name="anticuerposNoConfirmados" rows="3" placeholder="Describa los anticuerpos no confirmados..." required></textarea>
        <div class="invalid-feedback">Complete este campo.</div>
    </div>

    <button type="submit" class="btn btn-primary">Guardar</button>
</form>
